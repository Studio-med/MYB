<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOME MYB — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --gold-dim: rgba(201,168,76,0.15);
    --dark: #0A0C10;
    --dark2: #111318;
    --dark3: #1A1D24;
    --text: #E8E4D9;
    --text-dim: rgba(232,228,217,0.5);
    --border: rgba(201,168,76,0.2);
    --error: #E05C5C;
  }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Geometric background */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .bg-layer::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 50%, rgba(201,168,76,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 30%, rgba(201,168,76,0.04) 0%, transparent 50%),
      linear-gradient(160deg, #0A0C10 0%, #111318 50%, #0D0F14 100%);
  }

  .grid-lines {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 80%);
  }

  .corner-deco {
    position: fixed;
    width: 200px;
    height: 200px;
    opacity: 0.15;
  }
  .corner-deco.tl { top: -1px; left: -1px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
  .corner-deco.tr { top: -1px; right: -1px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
  .corner-deco.bl { bottom: -1px; left: -1px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }
  .corner-deco.br { bottom: -1px; right: -1px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

  /* Floating particles */
  .particle {
    position: fixed;
    width: 2px;
    height: 2px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0;
    animation: float-up 8s infinite;
  }
  @keyframes float-up {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    20% { opacity: 0.6; transform: translateY(-30px) scale(1); }
    100% { opacity: 0; transform: translateY(-200px) scale(0.3); }
  }

  /* Main container */
  .login-wrapper {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 460px;
    padding: 20px;
    animation: fade-in 1s ease forwards;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Logo / Brand */
  .brand {
    text-align: center;
    margin-bottom: 40px;
    animation: fade-in 1s 0.2s ease both;
  }

  .brand-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    position: relative;
  }

  .brand-icon svg {
    width: 100%;
    height: 100%;
  }

  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem;
    font-weight: 300;
    letter-spacing: 0.25em;
    color: var(--gold-light);
    line-height: 1;
    text-transform: uppercase;
  }

  .brand-sub {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    color: var(--text-dim);
    margin-top: 8px;
    text-transform: uppercase;
    font-weight: 300;
  }

  .brand-divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 16px auto 0;
  }

  /* Card */
  .login-card {
    background: linear-gradient(135deg, rgba(26,29,36,0.95) 0%, rgba(17,19,24,0.98) 100%);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 44px 40px;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(201,168,76,0.05),
      0 40px 80px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(201,168,76,0.1);
    animation: fade-in 1s 0.35s ease both;
  }

  .card-corner {
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: var(--gold);
    border-style: solid;
    opacity: 0.5;
  }
  .card-corner.tl { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .card-corner.tr { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
  .card-corner.bl { bottom: -1px; left: -1px; border-width: 0 0 1px 1px; }
  .card-corner.br { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

  /* Language toggle */
  .lang-toggle {
    display: flex;
    gap: 0;
    margin-bottom: 32px;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .lang-btn {
    flex: 1;
    padding: 8px 12px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 0.1em;
  }

  .lang-btn.active {
    background: var(--gold-dim);
    color: var(--gold-light);
    border-bottom: 1px solid var(--gold);
  }

  /* Form heading */
  .form-title {
    font-size: 0.78rem;
    letter-spacing: 0.25em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 28px;
    text-align: center;
  }

  /* Input groups */
  .input-group {
    margin-bottom: 20px;
  }

  .input-label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 500;
    opacity: 0.8;
  }

  .input-wrap {
    position: relative;
  }

  .input-field {
    width: 100%;
    background: rgba(10,12,16,0.8);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 12px 44px 12px 16px;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.3s;
    text-align: right;
  }

  .input-field:focus {
    border-color: rgba(201,168,76,0.5);
    background: rgba(10,12,16,0.95);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.06), inset 0 0 20px rgba(201,168,76,0.02);
  }

  .input-field::placeholder { color: var(--text-dim); font-size: 0.85rem; }

  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    width: 16px;
    height: 16px;
    pointer-events: none;
  }

  /* Error message */
  .error-msg {
    display: none;
    background: rgba(224,92,92,0.1);
    border: 1px solid rgba(224,92,92,0.3);
    border-radius: 2px;
    padding: 10px 14px;
    font-size: 0.82rem;
    color: var(--error);
    margin-bottom: 20px;
    text-align: center;
    letter-spacing: 0.05em;
  }

  .error-msg.show { display: block; animation: shake 0.4s ease; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* Submit button */
  .submit-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #C9A84C 0%, #A88738 60%, #C9A84C 100%);
    background-size: 200% 100%;
    border: none;
    border-radius: 2px;
    color: #0A0C10;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
    margin-top: 8px;
  }

  .submit-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .submit-btn:hover::before { transform: translateX(100%); }
  .submit-btn:hover { background-position: 100% 0; box-shadow: 0 4px 24px rgba(201,168,76,0.3); }
  .submit-btn:active { transform: scale(0.99); }

  .submit-btn.loading {
    pointer-events: none;
    opacity: 0.7;
  }

  /* Footer */
  .login-footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    animation: fade-in 1s 0.5s ease both;
  }

  .login-footer span {
    color: rgba(201,168,76,0.4);
    margin: 0 8px;
  }

  /* Success overlay */
  .success-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--dark);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }

  .success-overlay.show {
    display: flex;
    animation: fade-in 0.5s ease forwards;
  }

  .success-icon {
    width: 64px;
    height: 64px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse-ring 1.5s ease infinite;
  }

  @keyframes pulse-ring {
    0%,100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.4); }
    50% { box-shadow: 0 0 0 12px rgba(201,168,76,0); }
  }

  .success-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    color: var(--gold-light);
    letter-spacing: 0.2em;
  }

  .success-sub {
    font-size: 0.78rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="grid-lines"></div>
</div>

<!-- Decorative corners -->
<div class="corner-deco tl"></div>
<div class="corner-deco tr"></div>
<div class="corner-deco bl"></div>
<div class="corner-deco br"></div>

<!-- Particles -->
<div class="particle" style="left:15%;bottom:10%;animation-delay:0s;animation-duration:9s"></div>
<div class="particle" style="left:30%;bottom:5%;animation-delay:2s;animation-duration:11s"></div>
<div class="particle" style="left:60%;bottom:8%;animation-delay:4s;animation-duration:8s"></div>
<div class="particle" style="left:80%;bottom:12%;animation-delay:1s;animation-duration:12s"></div>
<div class="particle" style="left:45%;bottom:3%;animation-delay:3s;animation-duration:10s"></div>

<!-- Main -->
<div class="login-wrapper">

  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="32,4 60,18 60,46 32,60 4,46 4,18" stroke="#C9A84C" stroke-width="1" fill="none" opacity="0.4"/>
        <polygon points="32,12 52,22 52,42 32,52 12,42 12,22" stroke="#C9A84C" stroke-width="0.5" fill="none" opacity="0.6"/>
        <circle cx="32" cy="32" r="10" stroke="#C9A84C" stroke-width="1" fill="rgba(201,168,76,0.08)"/>
        <circle cx="32" cy="32" r="3" fill="#C9A84C"/>
        <line x1="32" y1="22" x2="32" y2="14" stroke="#C9A84C" stroke-width="0.8" opacity="0.7"/>
        <line x1="32" y1="42" x2="32" y2="50" stroke="#C9A84C" stroke-width="0.8" opacity="0.7"/>
        <line x1="22" y1="32" x2="14" y2="32" stroke="#C9A84C" stroke-width="0.8" opacity="0.7"/>
        <line x1="42" y1="32" x2="50" y2="32" stroke="#C9A84C" stroke-width="0.8" opacity="0.7"/>
      </svg>
    </div>
    <div class="brand-name">HOME MYB</div>
    <div class="brand-sub" id="brand-sub">منصة الإدارة المتكاملة</div>
    <div class="brand-divider"></div>
  </div>

  <div class="login-card">
    <div class="card-corner tl"></div>
    <div class="card-corner tr"></div>
    <div class="card-corner bl"></div>
    <div class="card-corner br"></div>

    <!-- Language toggle -->
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('ar')" id="btn-ar">العربية</button>
      <button class="lang-btn" onclick="setLang('fr')" id="btn-fr">Français</button>
    </div>

    <div class="form-title" id="form-title">تسجيل الدخول</div>

    <div class="error-msg" id="error-msg">بيانات الدخول غير صحيحة</div>

    <div class="input-group">
      <label class="input-label" id="label-user">اسم المستخدم</label>
      <div class="input-wrap">
        <input type="text" class="input-field" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" id="label-pass">كلمة المرور</label>
      <div class="input-wrap">
        <input type="password" class="input-field" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="handleLogin()">
      <span id="btn-text">دخول</span>
    </button>
  </div>

  <div class="login-footer">
    <span id="footer-text">HOME MYB</span>
    <span>◆</span>
    <span id="footer-year">2026</span>
    <span>◆</span>
    <span id="footer-version">v1.0</span>
  </div>
</div>

<!-- Success overlay -->
<div class="success-overlay" id="success-overlay">
  <div class="success-icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="2">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <div class="success-text" id="success-name">مرحباً</div>
  <div class="success-sub" id="success-sub">جاري التحميل...</div>
</div>

<script>
// ─── Users loaded from users.json ───────────────────────────────
// File structure: [{ "username": "admin", "password": "1234", "role": "admin", "name": "المدير", "redirect": "dashboard.html" }]

let currentLang = 'ar';
let users = [];

// Load users from external JSON
async function loadUsers() {
  try {
    const res = await fetch('users.json');
    if (!res.ok) throw new Error('not found');
    users = await res.json();
  } catch {
    // Fallback demo users if file not found
    users = [
      { username: "admin",    password: "admin123",  role: "admin",    name: "المدير العام",     redirect: "dashboard.html" },
      { username: "inspector",password: "insp456",   role: "inspector",name: "المفتش",           redirect: "inspections.html" },
      { username: "viewer",   password: "view789",   role: "viewer",   name: "المراقب",          redirect: "reports.html" }
    ];
    console.warn('users.json not found — using demo users');
  }
}

loadUsers();

// ─── Language ────────────────────────────────────────────────────
const translations = {
  ar: {
    brandSub:    'منصة الإدارة المتكاملة',
    formTitle:   'تسجيل الدخول',
    labelUser:   'اسم المستخدم',
    labelPass:   'كلمة المرور',
    placeholderUser: 'أدخل اسم المستخدم',
    placeholderPass: 'أدخل كلمة المرور',
    btnText:     'دخول',
    errorMsg:    'بيانات الدخول غير صحيحة',
    successSub:  'جاري التحميل...',
    loading:     'جاري التحقق...',
  },
  fr: {
    brandSub:    'Plateforme de gestion intégrée',
    formTitle:   'Connexion',
    labelUser:   'Nom d\'utilisateur',
    labelPass:   'Mot de passe',
    placeholderUser: 'Entrez votre identifiant',
    placeholderPass: 'Entrez votre mot de passe',
    btnText:     'Se connecter',
    errorMsg:    'Identifiants incorrects',
    successSub:  'Chargement en cours...',
    loading:     'Vérification...',
  }
};

function setLang(lang) {
  currentLang = lang;
  const t = translations[lang];
  const dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', dir);

  document.getElementById('brand-sub').textContent  = t.brandSub;
  document.getElementById('form-title').textContent  = t.formTitle;
  document.getElementById('label-user').textContent  = t.labelUser;
  document.getElementById('label-pass').textContent  = t.labelPass;
  document.getElementById('username').placeholder    = t.placeholderUser;
  document.getElementById('password').placeholder    = t.placeholderPass;
  document.getElementById('btn-text').textContent    = t.btnText;
  document.getElementById('error-msg').textContent   = t.errorMsg;

  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');

  // Input alignment
  document.querySelectorAll('.input-field').forEach(f => {
    f.style.textAlign = lang === 'ar' ? 'right' : 'left';
    f.style.paddingRight = lang === 'ar' ? '44px' : '16px';
    f.style.paddingLeft  = lang === 'ar' ? '16px' : '44px';
  });
  document.querySelectorAll('.input-icon').forEach(ic => {
    ic.style.left  = lang === 'ar' ? 'auto' : '14px';
    ic.style.right = lang === 'ar' ? '14px' : 'auto';
  });
}

// ─── Login ────────────────────────────────────────────────────────
async function handleLogin() {
  const t = translations[currentLang];
  const uInput = document.getElementById('username').value.trim();
  const pInput = document.getElementById('password').value.trim();
  const errEl  = document.getElementById('error-msg');
  const btn    = document.getElementById('submit-btn');

  errEl.classList.remove('show');

  if (!uInput || !pInput) {
    errEl.textContent = currentLang === 'ar' ? 'يرجى ملء جميع الحقول' : 'Veuillez remplir tous les champs';
    errEl.classList.add('show');
    return;
  }

  btn.classList.add('loading');
  document.getElementById('btn-text').textContent = t.loading;

  // Small delay for UX feel
  await new Promise(r => setTimeout(r, 800));

  const user = users.find(u => u.username === uInput && u.password === pInput);

  if (user) {
    // Save session
    sessionStorage.setItem('hmyb_user', JSON.stringify({ username: user.username, name: user.name, role: user.role }));

    // Show success
    const overlay = document.getElementById('success-overlay');
    document.getElementById('success-name').textContent =
      currentLang === 'ar' ? `مرحباً، ${user.name}` : `Bienvenue, ${user.name}`;
    document.getElementById('success-sub').textContent = t.successSub;
    overlay.classList.add('show');

    // Redirect after 1.5s
    setTimeout(() => {
      window.location.href = user.redirect || 'dashboard.html';
    }, 1500);
  } else {
    btn.classList.remove('loading');
    document.getElementById('btn-text').textContent = t.btnText;
    errEl.textContent = t.errorMsg;
    errEl.classList.add('show');
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});
</script>
</body>
</html>
